# Builds Shield's installers for Windows, macOS (Apple Silicon and Intel) and Linux on GitHub's machines.
#
# Run it from the Actions tab ("Build installers" > Run workflow) or by pushing a tag like v2.3.0.
# Then download the artifacts into release/ and run  python packaging/release.py  on your own computer:
#     gh run download <run-id> --dir release
# The update-signing key is deliberately NOT here. It never leaves your machine, so even a compromised GitHub
# account can build files but can't sign an update that installed copies of Shield would accept.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: "Build (PyInstaller, self-test, Inno Setup)"
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: release/Shield-Setup-*.exe
          if-no-files-found: error

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        id: macos-arm64 }    # Apple Silicon
          - { os: macos-15-intel,  id: macos-x64 }      # Intel Mac. Delete this line if you don't support Intel Macs.
          - { os: ubuntu-22.04,    id: linux-x64 }      # oldest supported glibc, so the build runs on newer distros too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: "Linux: libraries the web engine needs, and a virtual screen for the self-test"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libasound2 libegl1 libgl1 \
            libxdamage1 libxcomposite1 libxrandr2 libxtst6 libdbus-1-3 libfontconfig1
      - name: "Build (Linux, under a virtual display)"
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"   # only for the self-test inside this CI container
        run: xvfb-run -a bash packaging/build.sh
      - name: "Build (macOS)"
        if: runner.os == 'macOS'
        run: bash packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.id }}
          path: |
            release/Shield-*.dmg
            release/Shield-*.tar.gz
          if-no-files-found: error
